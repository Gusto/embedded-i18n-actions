name: Test Manual Translations Check

on:
  workflow_dispatch:

jobs:
  test-manual-translations-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test manual translations check
        uses: ./manual_translations_check
        with:
          file_patterns: |
            config/locales/es_US/**
            test/config/locales/es_US/**
            app/locales/es_US/**
          dry_run: 'true'
