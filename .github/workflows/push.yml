name: Lokalise Push
run-name: Push to Lokalise [${{ github.ref_name }}] ${{ github.event.after }}

on:
  workflow_dispatch:
    inputs:
      lokalise_token:
        description: 'Lokalise API token'
        required: true
      lokalise_project_id:
        description: 'Lokalise project ID'
        required: true
  push:
    branches:
      - main
    paths:
      - "config/locales/**en.yml"
      - "config/locales/**en.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lokalise CLI
        run: curl -sfL https://raw.githubusercontent.com/lokalise/lokalise-cli-2-go/master/install.sh | sh

      - name: Push source to Lokalise
        env:
          GITHUB_PREVIOUS_COMMIT: ${{ github.event.after }}
          GITHUB_CURRENT_COMMIT: ${{ github.event.before }}
          LOKALISE_API_TOKEN: ${{ github.event.inputs.lokalise_token }}
          LOKALISE_PROJECT_ID: ${{ github.event.inputs.lokalise_project_id }}
          ENV_LOKALISE_SOURCE_LANG_ISO: en
        run: |
             while read file 
             do 
                if [ -f $file ]
                then
                  ./bin/lokalise2 --token ${{ env.LOKALISE_API_TOKEN }} --project-id ${{ env.LOKALISE_PROJECT_ID }} file upload --file="${file}" --lang-iso ${{ env.ENV_LOKALISE_SOURCE_LANG_ISO }} --replace-modified --include-path --use-automations=true --cleanup-mode --poll-timeout 120s
                fi
             done < <(
             if [ -z ${{ env.GITHUB_CURRENT_COMMIT }} ]
             then
              git ls-files -- '**${{ env.ENV_LOKALISE_SOURCE_LANG_ISO }}.yml' '**${{ env.ENV_LOKALISE_SOURCE_LANG_ISO }}.json'
             else
              git diff --name-only ${{ env.GITHUB_PREVIOUS_COMMIT }} ${{ env.GITHUB_CURRENT_COMMIT }} -- '**${{ env.ENV_LOKALISE_SOURCE_LANG_ISO }}.yml' '**${{ env.ENV_LOKALISE_SOURCE_LANG_ISO }}.json'
             fi | awk NF)
