name: Test Check Locale YAML

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'check_locale_yaml/**'
      - 'test/config/locales/**'
      - '.github/workflows/test-check-locale-yaml.yml'
  push:
    branches: [main]

jobs:
  test-check-locale-yaml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run check locale YAML action
        uses: ./check_locale_yaml
        with:
          locale_paths: |
            test/config/locales/en
          dry_run: 'true'

      - name: Verify expected violations are detected
        env:
          LOCALE_PATHS: test/config/locales/en
          DRY_RUN: 'true'
        run: |
          set -e
          output=$(ruby check_locale_yaml/check_locale_yaml.rb)
          echo "$output"

          expected=4
          actual=$(echo "$output" | grep -E "^[0-9]+ Lokalise-incompatible" | grep -oE "^[0-9]+" || echo "0")
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected $expected violations, got $actual"
            exit 1
          fi
          echo "Detected $expected violations as expected"

          if ! echo "$output" | grep -qE "^-- Plain HTML values with single-quoted attributes \(2\) --$"; then
            echo "::error::Expected 2 HTML-attribute violations, not found in output"
            exit 1
          fi
          if ! echo "$output" | grep -qE "^-- Non-string mapping keys \(2\) --$"; then
            echo "::error::Expected 2 non-string-key violations, not found in output"
            exit 1
          fi
          echo "Detected both violation categories as expected"
