name: 'Pull Translations'
description: 'Pulls translations from Lokalise and creates a PR with the updates'

inputs:
  lokalise_project_id:
    description: 'Lokalise project ID'
    required: true
  github_token:
    description: 'GitHub token of the repo where the PR will be created'
    required: true
  lokalise_api_token:
    description: 'Lokalise API token'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure git
      shell: bash
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Lokalise CLI
      shell: bash
      run: |
        curl -sfL https://raw.githubusercontent.com/lokalise/lokalise-cli-2-go/master/install.sh | sh

    - name: Pull translations from Lokalise
      shell: bash
      env:
        LOKALISE_API_TOKEN: ${{ inputs.lokalise_api_token }}
        LOKALISE_PROJECT_ID: ${{ inputs.lokalise_project_id }}
      run: |
        ./bin/lokalise2 --token ${{ env.LOKALISE_API_TOKEN }} \
        --project-id ${{ env.LOKALISE_PROJECT_ID }} \
        file download \
        --format yml \
        --filter-langs=es_US \
        --original-filenames=true \
        --export-empty-as=skip \
        --directory-prefix=/ \
        --filter-data reviewed \
        --indentation 2sp\
        --yaml-include-root
    
    - name: Clean up
      shell: bash
      run: |
        rm bin/lokalise2

    - name: Creates PR
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ inputs.github_token }}
        commit-message: '[Lokalise] New translation available'
        committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
        branch: lokalise-update
        branch-suffix: short-commit-hash
        delete-branch: true
        title: '[Lokalise] New translation available'
        body: |
          - Auto-generated by [create-pull-request][1]

          [1]: https://github.com/peter-evans/create-pull-request
