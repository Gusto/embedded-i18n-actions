name: 'Pull Translations'
description: 'Pulls translations from Lokalise and creates a PR with the updates'

inputs:
  lokalise_project_id:
    description: 'Lokalise project ID'
    required: true
  github_token:
    description: 'GitHub token of the repo where the PR will be created'
    required: true
  lokalise_api_token:
    description: 'Lokalise API token'
    required: true
  file_format:
    description: 'Format in which the files will be downloaded from Lokalise (e.g. ruby_yml, yml, json, etc)'
    required: false
    default: 'ruby_yml'
  pr_title:
    description: 'Title (and commit message) used for the generated PR. Override this if your repo enforces a PR title format, e.g. conventional commits.'
    required: false
    default: '[Lokalise] New translation available'

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Configure git
      shell: bash
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Lokalise CLI
      shell: bash
      env:
        LOKALISE_CLI_VERSION: v3.1.7
        LOKALISE_CLI_INSTALL_SHA256: 191bd19dae6c810153c925a1787167992bf05871099170870572b3d48f006f6a
      run: |
        set -euo pipefail
        # Pin install.sh to an immutable commit SHA (tag v3.1.7) instead of the
        # mutable `master` branch, and verify its checksum before executing it.
        curl -sfL "https://raw.githubusercontent.com/lokalise/lokalise-cli-2-go/c5d2ebbcdff43ab1b5e57e2662ab670e491a385a/install.sh" -o install-lokalise-cli.sh
        echo "${LOKALISE_CLI_INSTALL_SHA256}  install-lokalise-cli.sh" | sha256sum -c -
        # Pin the downloaded lokalise2 binary to the same release; install.sh
        # verifies the binary's sha256 against the release's checksums.txt.
        sh install-lokalise-cli.sh "${LOKALISE_CLI_VERSION}"
        rm install-lokalise-cli.sh

    - name: Partition project files by original source format
      # `file download --format` is a single value applied to every file in
      # the export, but repos can mix source formats (e.g. mostly .yml with
      # one .json file). Lokalise preserves each file's real extension in
      # its own file list, so split filenames into a JSON bucket and an
      # everything-else bucket, and download each with the format that
      # actually matches -- otherwise the JSON-sourced file comes back with
      # a .yml extension and YAML content instead of JSON.
      id: partition_files
      shell: bash
      env:
        LOKALISE_API_TOKEN: ${{ inputs.lokalise_api_token }}
        LOKALISE_PROJECT_ID: ${{ inputs.lokalise_project_id }}
      run: |
        set -euo pipefail
        file_list=$(./bin/lokalise2 --token "${LOKALISE_API_TOKEN}" --project-id "${LOKALISE_PROJECT_ID}" file list)

        # `file list` prints one JSON document per page (each a separate top-level
        # value) once a project has more files than the client's page limit. -s
        # (slurp) wraps every printed document into one array first, so `.[].files[]`
        # covers all of them whether there was one page or many -- a plain `.files[]`
        # would silently see only the first page's files.
        json_filenames=$(echo "$file_list" | jq -rs '[.[].files[]? | select(.filename | endswith(".json")) | .filename] | join(",")')
        other_filenames=$(echo "$file_list" | jq -rs '[.[].files[]? | select((.filename | endswith(".json") | not) and .filename != "__unassigned__") | .filename] | join(",")')

        echo "json_filenames=${json_filenames}" >> "$GITHUB_OUTPUT"
        echo "other_filenames=${other_filenames}" >> "$GITHUB_OUTPUT"
        echo "Files with a JSON source format: ${json_filenames:-<none>}"
        echo "Files with a non-JSON source format: ${other_filenames:-<none>}"

    - name: Pull JSON-sourced translations from Lokalise
      if: steps.partition_files.outputs.json_filenames != ''
      shell: bash
      env:
        LOKALISE_API_TOKEN: ${{ inputs.lokalise_api_token }}
        LOKALISE_PROJECT_ID: ${{ inputs.lokalise_project_id }}
        JSON_FILENAMES: ${{ steps.partition_files.outputs.json_filenames }}
      run: |
        ./bin/lokalise2 --token "${LOKALISE_API_TOKEN}" \
        --project-id "${LOKALISE_PROJECT_ID}" \
        file download \
        --format json \
        --filter-filenames="${JSON_FILENAMES}" \
        --filter-langs=es_US \
        --original-filenames=true \
        --export-empty-as=skip \
        --directory-prefix=/ \
        --filter-data reviewed \
        --indentation 2sp \
        --placeholder-format icu \
        --replace-breaks=false

    - name: Pull translations from Lokalise
      if: steps.partition_files.outputs.other_filenames != ''
      shell: bash
      env:
        LOKALISE_API_TOKEN: ${{ inputs.lokalise_api_token }}
        LOKALISE_PROJECT_ID: ${{ inputs.lokalise_project_id }}
        OTHER_FILENAMES: ${{ steps.partition_files.outputs.other_filenames }}
      run: |
        ./bin/lokalise2 --token "${LOKALISE_API_TOKEN}" \
        --project-id "${LOKALISE_PROJECT_ID}" \
        file download \
        --format ${{ inputs.file_format }} \
        --filter-filenames="${OTHER_FILENAMES}" \
        --filter-langs=es_US \
        --original-filenames=true \
        --export-empty-as=skip \
        --directory-prefix=/ \
        --filter-data reviewed \
        --indentation 2sp \
        --placeholder-format icu \
        --replace-breaks=false \
        --yaml-include-root

    - name: Clean up
      shell: bash
      run: |
        rm bin/lokalise2

    - name: Creates PR
      uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
      with:
        token: ${{ inputs.github_token }}
        commit-message: ${{ inputs.pr_title }}
        committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
        branch: lokalise-update
        branch-suffix: short-commit-hash
        delete-branch: true
        title: ${{ inputs.pr_title }}
        labels: lokalise-translation
        body: |
          - Auto-generated by [create-pull-request][1]

          [1]: https://github.com/peter-evans/create-pull-request
